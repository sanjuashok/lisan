name: macOS
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core regression checks and native UI build
        run: ./scripts/test.sh
      - name: Build production app with FluidAudio and Foundation Models
        run: ./scripts/build-app.sh
